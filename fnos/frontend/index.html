<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FusionPlay</title>
<script>
  const routes = {
    '#/receive': 'player/index.html#/settings',
    '#/settings': 'player/index.html#/settings',
    '#/audio': 'speakers.html#outputs',
    '#/curve': 'speakers.html#curve'
  };
  const query = new URLSearchParams(location.search);
  const route = query.get('action') === 'new-instance' ? 'speakers.html#new' :
    routes[location.hash] || 'player/index.html';
  const target = new URL(route, document.baseURI);
  target.search = location.search;
  location.replace(target.href);
</script>
</head><body><a href="player/index.html">打开 FusionPlay 播放器</a></body></html>
