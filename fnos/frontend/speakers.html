<!doctype html>
<html lang="zh-CN"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>音箱 · FusionPlay</title><link rel="stylesheet" href="speakers.css">
<script src="js/browser-diagnostics.js"></script>
</head><body>
<div class="scene" aria-hidden="true"><img id="scene-art" alt="" hidden></div>
<svg class="defs" aria-hidden="true"><defs id="glass-filters"></defs></svg>
<header><div class="brand"><img src="player/fnos-mark.png" alt="">FusionPlay</div><a id="back" class="back" href="player/index.html">返回播放器 <span aria-hidden="true">↗</span></a></header>
<main>
<section id="rooms" hidden>
<div class="heading"><h1>选择音箱</h1><a class="button" id="add-room">＋ 新建实例</a></div>
<a id="manage-outputs" class="back">主接收器输出 ↗</a>
<div class="room-grid" id="room-list"></div>
</section>
<section id="new" hidden>
<h1 id="bind-title">新建实例</h1>
<form class="card bind" id="bind-form">
<label for="room-name">投送名称</label>
<input id="room-name" maxlength="64" required placeholder="例如：客厅">
<label for="bind-device">输出音箱</label><select id="bind-device" required></select>
<p id="bind-hint"></p>
<div class="footer"><button id="bind" class="primary">保存绑定</button></div>
<button type="button" id="remove-instance" hidden>移除实例</button>
</form></section>
<section id="outputs" hidden>
<div class="heading"><h1>主接收器输出</h1><a class="back" id="outputs-rooms">所有音箱 ↗</a></div>
<form class="card bind" id="outputs-form">
<fieldset id="output-fields" disabled>
<label for="output-select">输出音箱</label><select id="output-select"></select>
<p id="output-owner"></p>
<label><input type="checkbox" id="output-enable"> 用于主接收器</label>
<label for="output-gain">响度平衡（dB）</label><input type="number" id="output-gain" min="-30" max="0" step="0.5">
<label for="output-delay">同步延迟（ms）</label><input type="number" id="output-delay" min="0" max="2000" step="any">
<label for="output-rate">设备采样率</label><select id="output-rate"></select>
<div class="toolbar"><button type="button" id="output-test">测试音</button><button type="button" id="output-forget">移除设备</button></div>
</fieldset>
<button type="button" id="output-refresh">刷新设备</button>
<label for="output-level">全局输出音量（%）</label><input type="number" id="output-level" min="0" max="100" step="any" required>
<label><input type="checkbox" id="output-mute"> 所有输出静音</label>
<label for="group-name">输出方案</label><input id="group-name" maxlength="64" placeholder="方案名称">
<button type="button" id="group-add">记录当前组合</button><div id="output-groups"></div>
<div class="footer"><button id="outputs-save" class="primary" disabled>保存并应用</button></div>
</form></section>
<section id="curve" hidden>
<div class="heading"><div><p class="context" id="room-label"></p><h1>音量响应</h1></div><a id="all-rooms" class="back">所有音箱 ↗</a></div>
<p role="status" id="binding-result"></p>
<div id="curve-device-row" class="device-row"><label for="curve-device">输出音箱</label><select id="curve-device"></select></div>
<div id="editor" class="card editor" hidden>
<div class="controls"><div class="small">响应模式</div><div id="modes" class="modes" role="group" aria-label="响应模式"></div>
<div class="response"><label for="probe">音量映射预览</label><output for="probe" id="readout"></output><div class="probe-slider"><span class="probe-track" aria-hidden="true"></span><span class="probe-lens" aria-hidden="true"></span><input type="range" id="probe" aria-label="预览发送端音量" min="0" max="100" value="50"></div></div>
</div>
<div class="plot"><div class="axis">音箱输出幅度</div><canvas id="graph" tabindex="0" aria-label="音量响应曲线，自定义模式可拖动控制点"></canvas><div class="x-axis">发送端音量</div></div>
<div id="custom" hidden><div class="toolbar"><strong>控制点</strong><button type="button" id="add">添加点</button><button type="button" id="reset">重置</button></div><div id="points"></div></div>
<div class="footer editor-foot"><span id="save-state" role="status"></span><button id="save" class="primary" disabled>保存曲线</button></div>
</div></section>
<p id="notice" role="status"></p><button id="retry" hidden>重新加载</button>
</main>
<dialog class="card" id="confirm-action" aria-labelledby="confirm-title">
<form method="dialog"><h2 id="confirm-title"></h2>
<div class="footer"><button value="cancel" autofocus>取消</button><button value="confirm" class="primary" id="confirm-accept"></button></div>
</form></dialog>
<script src="js/core.js"></script><script src="js/glass.js"></script><script src="js/curve.js"></script><script src="js/outputs.js"></script><script src="js/speakers.js"></script>
</body></html>
