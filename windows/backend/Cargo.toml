[package]
name = "fusionplay-windows-host"
version = "1.3.2"
edition = "2024"
license = "AGPL-3.0-only"
description = "FusionPlay Windows host sidecar: AirPlay 2 + DLNA + MiPlay receiver"
publish = false
build = "build.rs"

[lib]
name = "fusionplay_windows"
path = "src/lib.rs"

[[bin]]
name = "FusionPlayCore"
path = "src/main.rs"

[dependencies]
airplay-receiver-core = { path = "../../src/AirPlayReceiver.Core" }
fusionplay-miplay-sdk = { path = "../../src/FusionPlay.MiPlaySdk" }
if-addrs = { path = "../../src/FusionPlay.AndroidIfAddrs" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = [
    "aac",
    "mp3",
    "flac",
    "wav",
    "isomp4",
    "pcm",
    "adpcm",
    "ogg",
    "vorbis",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "signal",
    "sync",
    "time",
    "net",
    "io-util",
    "io-std",
] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rubato = "3"
cpal = "0.17"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Power",
    "Win32_System_WindowsProgramming",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "symbols"
