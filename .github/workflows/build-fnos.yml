name: Build fnOS FPK

# 触发：
#   - workflow_dispatch：手动出包
#   - push tags `fnos-*`：打 tag 时出包并附到 GitHub Release
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'fnos/package/**'
      - 'fnos/backend/Cargo.toml'
      - 'fnos/tools/*fpk*'
      - '.github/actions/setup-flutter/**'
      - 'fnos/tools/simulate-*.sh'
      - '.github/workflows/build-fnos.yml'
  push:
    tags:
      - 'fnos-*'

# softprops/action-gh-release 需要写权限；默认 GITHUB_TOKEN 只读，不加会 403。
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  player-web:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-flutter
      - name: Compile the shared NAS player
        working-directory: flutter
        run: |
          flutter pub get --enforce-lockfile
          flutter build web --release --no-pub --no-web-resources-cdn --pwa-strategy=none -t lib/backend/fnos/player.dart
      - uses: actions/upload-artifact@v4
        with:
          name: fnos-player-web
          path: flutter/build/web/
          if-no-files-found: error
          retention-days: 1

  build-fnos:
    needs: player-web
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            fpk: fusionplay-fnos.fpk
            artifact: fusionplay-fnos-fpk
          - arch: arm64
            runner: ubuntu-22.04-arm
            fpk: fusionplay-fnos-arm64.fpk
            artifact: fusionplay-fnos-fpk-arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust 侧依赖：cpal → alsa-sys 需要 libasound2-dev + pkg-config；
      # build-essential/cmake 给可能存在的 C 依赖兜底；iproute2/procps/python3 给沙箱模拟脚本用。
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev pkg-config build-essential cmake \
            curl tar iproute2 procps python3
          echo "ALSA: $(pkg-config --modversion alsa)"

      - name: Set up Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            fnos/backend/target
            src/AirPlayReceiver.Core/target
            src/FusionPlay.MiPlaySdk/target
            vendor/shairplay/target
          # key 必须覆盖所有 Cargo.lock/Cargo.toml，否则依赖变化会命中旧缓存
          key: ${{ runner.os }}-${{ runner.arch }}-fnos-cargo-${{ hashFiles('fnos/backend/Cargo.lock', 'fnos/backend/Cargo.toml', 'src/AirPlayReceiver.Core/Cargo.lock', 'src/AirPlayReceiver.Core/Cargo.toml', 'src/FusionPlay.MiPlaySdk/Cargo.lock', 'src/FusionPlay.MiPlaySdk/Cargo.toml', 'src/FusionPlay.AndroidIfAddrs/Cargo.lock', 'vendor/shairplay/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-fnos-cargo-

      - name: Check shared Flutter design values
        run: python3 tools/sync_web_theme.py --check

      - name: Toolchain sanity check
        run: |
          rustc --version
          cargo --version
          uname -m

      - name: Install official ARM64 fnpack
        if: matrix.arch == 'arm64'
        run: |
          curl --fail --location --retry 3 https://static2.fnnas.com/fnpack/fnpack-1.3.3-linux-arm -o "$RUNNER_TEMP/fnpack"
          echo "213c05a3df07ff881110d9f227926cd2d19601fc4f621815e673bd9ec0ff9373  $RUNNER_TEMP/fnpack" | sha256sum -c -
          chmod 0755 "$RUNNER_TEMP/fnpack"
          echo "FPK_FNPACK=$RUNNER_TEMP/fnpack" >> "$GITHUB_ENV"

      # 后端单测使用 null 音频后端（CI 无声卡），不会打开真实 /dev/snd。
      # （audio_engine_mock 的 drift 断言已改为串行 + 稳定不变量 + 确定性收敛测试，不再 flaky）
      - name: Backend unit tests (null audio, no hardware)
        timeout-minutes: 20
        run: cargo test --manifest-path fnos/backend/Cargo.toml --all-targets

      # 复用的协议核心：AirPlay 2 / DLNA 控制面。个别用例可能依赖本机网络栈，
      # 加 step 级超时避免个别用例挂住整个 job（job 总时长仍受 90min 约束）。
      - name: Protocol core tests (AirPlay 2 / DLNA reuse)
        timeout-minutes: 20
        run: |
          cargo test --manifest-path src/AirPlayReceiver.Core/Cargo.toml --lib
          cargo test --manifest-path src/AirPlayReceiver.Core/Cargo.toml --test external_output

      - name: MiPlay SDK tests
        timeout-minutes: 20
        run: cargo test --manifest-path src/FusionPlay.MiPlaySdk/Cargo.toml --lib

      - uses: actions/download-artifact@v4
        with:
          name: fnos-player-web
          path: player-web

      - name: Build release binary
        timeout-minutes: 20
        run: cargo build --release --manifest-path fnos/backend/Cargo.toml

      # build-fpk 内含守卫：manifest.version == backend Cargo.toml version == 二进制 --version、
      # platform 与构建架构一致、service_port 与 cmd/main 默认一致、fnpack 输出含 "Packing successfully"。
      - name: Build FPK
        timeout-minutes: 15
        env:
          FPK_PLAYER_WEB_DIR: ${{ github.workspace }}/player-web
        run: ./fnos/tools/build-fpk.sh

      - name: Check FPK structure and fnOS spec
        run: ./fnos/tools/check-fpk.sh fnos/dist/${{ matrix.fpk }}

      # 沙箱模拟：install_init → install_callback → main start → status=0 → /healthz → stop → status=3
      # 使用随机端口 + 临时目录，不碰 NAS/真机；音频后端强制 null。
      - name: Simulate install lifecycle (sandboxed)
        timeout-minutes: 10
        run: ./fnos/tools/simulate-install.sh fnos/dist/${{ matrix.fpk }}

      - name: Exercise same-architecture upgrade lifecycle
        env:
          GH_TOKEN: ${{ github.token }}
        timeout-minutes: 25
        run: ./fnos/tools/simulate-upgrade.sh fnos/dist/${{ matrix.fpk }}

      - name: Upload FPK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: fnos/dist/${{ matrix.fpk }}
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build-fnos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: fusionplay-fnos-fpk*
          merge-multiple: true
      - name: Verify both architectures match the release tag
        run: |
          for fpk in fusionplay-fnos.fpk fusionplay-fnos-arm64.fpk; do
            version=$(tar -xzOf "$fpk" manifest | awk -F= '$1 ~ /^version[[:space:]]*$/ {gsub(/[[:space:]"]/, "", $2); print $2}')
            test "$GITHUB_REF_NAME" = "fnos-v$version"
          done
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fusionplay-fnos.fpk
            fusionplay-fnos-arm64.fpk
          fail_on_unmatched_files: true
          generate_release_notes: true
