include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Vendored libraries retain upstream deprecated compatibility aliases.
    - third_party/**
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_print: true
    prefer_single_quotes: true
